<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Belajar JS lagi</title>
</head>
<body>
  <script>
    let a ="Hidup";
    let b ="Jokowi";
    console.log(a,"",b);

    const angka1=1;
    const angka2=2;
    const jumlah = parseFloat (angka1 / angka2) ;
    console.log(jumlah);

    let total=100;
    total+=50;
    total-+20;
    console.log(total);

    // operator increment dan decrement : menambah dan mengurangi
    let nomor = 1;
    nomor++;
    nomor++;
    nomor--;
    nomor--;
    console.log(nomor);

    // operator perbandingan : < (lebih kecil) , > (lebih besar), ===(perbandingan hingga ke tipe data),
    // ==(membandingkan), !== (tidak sama dengan)

    let nama= "Budi";
    let konfirmasiNama = "Budi";
    let konfirmasi = (nama === konfirmasiNama); //hasil:true --> == membandingkan isinya, === membandingkan isi dan tipe datanya
    console.log(konfirmasi);

    let umur = 20;
    let batasumur = 17;
    let batasan = (umur > 17); //true

    // operator logika : && and, || or, ! not
    let budi = "Budi";
    let andi = "Andi";
    console.log(budi && andi);

    let username = "admin";
    let password = "admin";
    console.log(username === "admin" && password === "admin"); // login berhasil
    console.log(username === "admin" || password === "admin"); // login berhasil (sekalipun isi datanya berbeda, maka login berhasil)

    // operator if...else ternary/short hand
    const age = 6;
    if (age>=17){
      console.log('Dewasa')
    } else {
      console.log('Anak-Anak')
    }

    const statusAge = age >= 17 ? 'Dewasa':'Anak-anak'
    console.log(statusAge);
    
  </script>
</body>
</html>
