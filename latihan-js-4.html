<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Looping</title>
</head>
<body>
  <script>
      //looping (perulangan)
      //for, foreach, while, do while

      for(let i=0; i < 10; i++){
        console.log("Nilai variabel i ",i);
        console.log(`Nilai variabel i ${i}`);
      }
  </script>
</body>
</html>
